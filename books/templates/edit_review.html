{% extends 'base.html' %}
{% block start %}

<div class="container mt-4">
    <h2>Edit Your Review</h2>
    <form method="POST" action="{% url 'edit_review' review.id %}">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="rating">Rating:</label>
            <select name="rating" id="rating" class="form-control" required>
                {% for i in "12345" %}
                    <option value="{{ i }}" {% if review.rating|stringformat:"s" == i %}selected{% endif %}>{{ i }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group mt-2">
            <label for="comment">Comment:</label>
            <textarea name="comment" id="comment" rows="4" class="form-control" required>{{ review.comment }}</textarea>
        </div>

        <button type="submit" class="btn btn-success mt-3">Update Review</button>
        <a href="{% url 'book_detail' review.book.id %}" class="btn btn-secondary mt-3">Cancel</a>
    </form>
</div>

{% endblock %}
