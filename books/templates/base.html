<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <title>BOOK REVIEW SYSTEM</title>
  </head>
  <body>
    <nav class="navbar navbar-light" style="background-color: rgb(0, 0, 0)">
      <a
      href="/"
        class="navbar-brand"
        style="color: white; font-family: Verdana, Geneva, Tahoma, sans-serif"
        >Book Review System</a>

     

      {% if user.is_authenticated %}
        <p style="color: white">Welcome {{user.username}} ({{user.user_type}})</p>
        <div style="display: flex; gap: 10px;">
          
        {% if user.user_type == 'admin' %}
        <a class="btn btn-success" href="{%  url 'add_book' %} ">Add Book </a>
        {% endif %}
        <form class="form-inline">
        <a href="/logout/" class="btn btn-success" type="submit">Logout</a>
 
        </div>      
      {% else %}
      <div style="display: flex; gap: 10px;">
        <a href="/login/" class="btn btn-success" type="submit">Login</a>
        <a href="/register/" class="btn btn-success" type="submit">Register</a>
      </div>

      {% endif %}
      </form>
    </nav>
  </body>
</html>

{% block start %} {% endblock %}
