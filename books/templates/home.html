{% extends 'base.html' %}

{% block start %}
<style>
    body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: url('https://images.unsplash.com/photo-1481627834876-b7833e8f5570?q=80&w=1828&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D') no-repeat center center fixed;
        background-size: cover;
    }

    .wrapper-container{
        height: 95vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .hero-container {
        height: 50vh;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        text-align: center;
        background-color: rgba(255, 255, 255, 0.85);
        padding: 40px;
        border-radius: 12px;
        max-width: 600px;
        margin: auto;
        box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    .hero-container h1 {
        font-size: 60px;
        font-weight: bold;
        color: #333;
        margin-bottom: 10px;
    }

    .hero-container p {
        font-size: 24px;
        color: #555;
        margin: 15px 0;
    }

    .hero-container a.btn {
        margin-top: 25px;
        font-size: 18px;
        padding: 12px 30px;
        background-color: #6b4c2e;
        color: white;
        border-radius: 8px;
        text-decoration: none;
        transition: background-color 0.3s ease;
    }

    .hero-container a.btn:hover {
        background-color: #4b3521;
    }
</style>
<div class="wrapper-container">
<div class="hero-container">
    <h1>MY BOOKS</h1>
    <p>Meet your next favorite book.</p>
    <a href="{% url 'book_list' %}" class="btn">View All Books</a>
</div></div>
{% endblock %}
